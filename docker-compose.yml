services:
  # MinIO 对象存储
  minio:
    image: minio/minio:latest
    container_name: graduation-project-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${EDURAG_MINIO_ROOT_USER:-demo-minio-user}
      MINIO_ROOT_PASSWORD: ${EDURAG_MINIO_ROOT_PASSWORD:-demo-minio-password-change-me}
    ports:
      - "${EDURAG_MINIO_API_HOST_PORT:-19000}:9000"
      - "${EDURAG_MINIO_CONSOLE_HOST_PORT:-19001}:9001"
    volumes:
      - minio-data:/data
    networks:
      - graduation-network
    restart: unless-stopped

  # Milvus 依赖的 etcd
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: graduation-project-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >-
      etcd
      --advertise-client-urls=http://etcd:2379
      --listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    volumes:
      - milvus-etcd-data:/etcd
    networks:
      - graduation-network
    restart: unless-stopped

  # Milvus 向量数据库
  milvus:
    image: milvusdb/milvus:v2.4.15
    container_name: graduation-project-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${EDURAG_MINIO_ROOT_USER:-demo-minio-user}
      MINIO_SECRET_ACCESS_KEY: ${EDURAG_MINIO_ROOT_PASSWORD:-demo-minio-password-change-me}
    ports:
      - "${EDURAG_MILVUS_HOST_PORT:-19530}:19530"
    depends_on:
      - etcd
      - minio
    volumes:
      - milvus-data:/var/lib/milvus
    networks:
      - graduation-network
    restart: unless-stopped

  # 后端服务
  backend:
    build:
      context: ./rag_qa
      dockerfile: web/Dockerfile.backend
    container_name: graduation-project-backend
    ports:
      - "${EDURAG_BACKEND_HOST_PORT:-8000}:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - EDURAG_STORAGE_BACKEND=minio
      - EDURAG_MINIO_ENDPOINT=minio:9000
      - EDURAG_MINIO_ACCESS_KEY=${EDURAG_MINIO_ROOT_USER:-demo-minio-user}
      - EDURAG_MINIO_SECRET_KEY=${EDURAG_MINIO_ROOT_PASSWORD:-demo-minio-password-change-me}
      - EDURAG_MINIO_BUCKET=edurag-knowledge
      - EDURAG_MINIO_SECURE=false
      - EDURAG_MILVUS_HOST=milvus
      - EDURAG_MILVUS_PORT=19530
    depends_on:
      - minio
      - milvus
    networks:
      - graduation-network
    volumes:
      - ./rag_qa:/app

  # 前端服务
  frontend:
    build:
      context: ./rag_qa/web/frontend
      dockerfile: Dockerfile
    container_name: graduation-project-frontend
    ports:
      - "${EDURAG_FRONTEND_HOST_PORT:-5173}:5173"
    environment:
      - VITE_API_PROXY_TARGET=http://backend:8000
    depends_on:
      - backend
    networks:
      - graduation-network

volumes:
  minio-data:
  milvus-etcd-data:
  milvus-data:

networks:
  graduation-network:
    driver: bridge
